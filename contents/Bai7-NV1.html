<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thực hành tạo biểu mẫu</title>
</head>
<body>

    <h3>Đóng góp ý kiến cho thư viện của nhà trường</h3>

    <form action="#">
        <fieldset>
            <legend>1. Thông tin về người góp ý</legend>
            
            <label>Họ và tên: </label>
            <input type="text" name="txtTen">
            <br><br>

            <label>Địa chỉ email: </label>
            <input type="text" name="txtEmail">
        </fieldset>

        <fieldset>
            <legend>2. Đóng góp ý kiến</legend>
            
            <label>Ý kiến đóng góp: </label><br>
            <textarea name="txtComment" rows="6" cols="40"></textarea>
        </fieldset>
    </form>

</body>
</html>
