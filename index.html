<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Website Tin 12</title>

<style>
body{
    margin:0;
    font-family:Arial;
}

/* HEADER */
header{
    background:#0b5fa5;
    color:white;
    text-align:center;
    padding:20px;
    font-size:24px;
    font-weight:bold;
}

/* MENU */
nav{
    background:#1c3f5e;
    padding:10px;
    text-align:center;
}

nav button{
    background:none;
    border:none;
    color:white;
    font-weight:bold;
    margin:15px;
    cursor:pointer;
    font-size:16px;
}

nav button:hover{
    color:yellow;
}

/* CONTENT */
.content{
    padding:30px;
    min-height:300px;
}

/* Ẩn nội dung */
.section{
    display:none;
}

/* FOOTER */
footer{
    background:#1c3f5e;
    color:white;
    text-align:center;
    padding:10px;
}
</style>

<script>
function hien(id){
    var tatca = document.getElementsByClassName("section");
    for(var i=0;i<tatca.length;i++){
        tatca[i].style.display="none";
    }
    document.getElementById(id).style.display="block";
}
</script>

</head>

<body>

<header>
TRƯỜNG THPT NGÔ QUYỀN TPHCM
<br>
<span style="font-size:18px;">Chuyên trang Tin học 12</span>
</header>

<nav>
<button onclick="hien('gioithieu')">Giới thiệu</button>
<button onclick="hien('tinhoc')">Tin học</button>
<button onclick="hien('thoikhoabieu')">Thời khóa biểu</button>
<button onclick="hien('style')">Style</button>
</nav>

<div class="content">

<div id="gioithieu" class="section">
<h2>GIỚI THIỆU</h2>
<p>Dán nội dung giới thiệu của bạn vào đây.</p>
</div>

<div id="tinhoc" class="section">
<h2>TIN HỌC</h2>
<p>Dán nội dung Tin học bạn đã làm vào đây.</p>
</div>

<div id="thoikhoabieu" class="section">
<h2>THỜI KHÓA BIỂU</h2>
<p>Dán thời khóa biểu bạn đã code vào đây.</p>
</div>

<div id="style" class="section">
<h2>STYLE</h2>
<p>Dán nội dung style của bạn vào đây.</p>
</div>

</div>

<footer>
© 2026 Trường THPT Ngô Quyền TPHCM
</footer>

</body>
    </html>
